apiVersion: v1
kind: ConfigMap
metadata:
  name: scrapling-neo4j
  namespace: scraper
data:
  NEO4J_URI: "bolt://my-neo4j.neo4j-test.svc.cluster.local:7687"
  NEO4J_DB: "neo4j"
  TARGET_URLS: "https://quotes.toscrape.com"
  FETCH_MODE: "http"
  MAX_LINKS: "500"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrapling-neo4j
  namespace: scraper
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: scrapling
            image: scrapper:dev 
            imagePullPolicy: IfNotPresent
            envFrom:
            - configMapRef: {name: scrapling-neo4j}
            env:
            - name: NEO4J_USER
              valueFrom: {secretKeyRef: {name: neo4j-creds, key: user}}
            - name: NEO4J_PASS
              valueFrom: {secretKeyRef: {name: neo4j-creds, key: pass}}
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {memory: 2Gi}
            volumeMounts:
            - {name: shm, mountPath: /dev/shm}
          volumes:
          - name: shm
            emptyDir: {medium: Memory, sizeLimit: 512Mi}
